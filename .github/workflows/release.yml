name: Release

# Builds, signs, notarizes and publishes a Sugu release.
#
#   prepare ── notes (release-notes.yml) ── build (xcode-27) ── publish (R2) ── site (deploy-site.yml)
#
# A pushed vX.Y.Z tag releases it; project.yml's MARKETING_VERSION must
# match. Releases go to sugu.zheng-she.com, not GitHub (ADR 0006), unless
# vars.R2_PUBLISH and vars.RELEASE_TO_GITHUB send them to a GitHub release.
# Dispatched by hand without a tag and with publishing off, it is a dry run
# of the current branch: everything up to notarization, nothing published.
# The notes come before the build because the build signs them into the
# appcast.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (vX.Y.Z); empty for a dry run of this branch"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish the release to sugu.zheng-she.com"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a release half way through publishing.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Resolve the tag
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          R2_PUBLISH: ${{ vars.R2_PUBLISH }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            # vars.R2_PUBLISH=false holds tagged releases back from R2.
            if [ "${R2_PUBLISH:-}" = "false" ]; then PUBLISH=false; else PUBLISH=true; fi
          else
            TAG="$INPUT_TAG"
            PUBLISH="$INPUT_PUBLISH"
          fi
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tags are vX.Y.Z, one stable channel. Got: $TAG"
            exit 1
          fi
          if [ -z "$TAG" ] && [ "$PUBLISH" = "true" ]; then
            echo "::error::Publishing needs a tag."
            exit 1
          fi
          { echo "tag=$TAG"; echo "publish=$PUBLISH"; echo "ref=${TAG:-$GITHUB_SHA}"; } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Check the version
        id: meta
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PUBLISH: ${{ steps.tag.outputs.publish }}
        run: |
          set -euo pipefail
          VERSION=$(awk '$1 == "MARKETING_VERSION:" { print $2; exit }' project.yml)
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::project.yml has MARKETING_VERSION $VERSION but the tag is $TAG."
            exit 1
          fi
          # The build number is the tag's day, which only an annotated tag carries.
          if [ -n "$TAG" ]; then
            git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
              echo "::error::$TAG is a lightweight tag; tag releases with git tag -a $TAG -m $TAG."
              exit 1
            fi
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  notes:
    needs: prepare
    uses: ./.github/workflows/release-notes.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build:
    needs: [prepare, notes]
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # The build number (yymmddvv) reads the tags; the notes, the history.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Install build tools
        run: brew install xcodegen

      - name: Restore native dependencies and data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vendor
            Frameworks
            Data
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/versions.sh', 'scripts/build-librime.sh', 'scripts/patches/**', 'scripts/build-data.sh', 'Packages/SuguKit/Sources/sugu-tool/**', 'Packages/SuguKit/Sources/SuguRime/**', 'Packages/SuguKit/Sources/SuguCore/Lexicon/**', 'Packages/SuguKit/Sources/SuguLM/**', 'scripts/fetch-data.sh') }}

      - name: Download notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Import signing certificates
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          import() {
            local file="$RUNNER_TEMP/certificate.p12"
            echo "$1" | base64 --decode > "$file"
            security import "$file" -P "$2" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            rm -f "$file"
          }
          import "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD"
          import "$APPLE_INSTALLER_CERTIFICATE" "$APPLE_INSTALLER_CERTIFICATE_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write keys
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_API_KEY SPARKLE_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || { echo "::error::secrets.$name is unset."; exit 1; }
          done
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          {
            echo "APPLE_API_KEY_FILE=$RUNNER_TEMP/api-key.p8"
            echo "SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle.key"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        shell: bash
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag && needs.prepare.outputs.version || '' }}
        run: |
          set -euo pipefail
          APPLE_API_KEY="$APPLE_API_KEY_FILE" RELEASE_NOTES_DIR="$RUNNER_TEMP/notes" scripts/release.sh
          mkdir -p dist/notes
          cp "$RUNNER_TEMP"/notes/*.md dist/notes/

      - name: Keep the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/*.pkg
            dist/*.zip
            dist/appcast.xml
            dist/release.json
            dist/notes/
            dist/symbols/

      - name: Clean up keys
        if: always()
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/api-key.p8" "$RUNNER_TEMP/sparkle.key"

  # vars.RELEASE_TO_GITHUB=true also attaches each tagged release to a GitHub
  # release on this private repository.
  github-release:
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != '' && vars.RELEASE_TO_GITHUB == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file dist/notes/body.md \
            dist/*.pkg dist/*.zip dist/appcast.xml dist/release.json

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    # One publish at a time across tags: each reads and rewrites the lists.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Publish to sugu.zheng-she.com
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: scripts/publish-release.sh

  site:
    needs: publish
    uses: ./.github/workflows/deploy-site.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
