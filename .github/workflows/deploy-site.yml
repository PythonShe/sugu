name: Deploy Site

# Builds site/ (Astro) and deploys it to the Cloudflare Pages project `sugu`
# at sugu.zheng-she.com, with the functions that serve releases from R2.
# Runs when the site or what it shows changes, after every release (from
# release.yml, so the changelog lists it), and by hand.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - Assets/svg/**
      - LICENSE
      - Sugu/Resources/ThirdPartyNotices.txt
      - .github/workflows/deploy-site.yml
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      # Called from a release, the caller's ref is its tag: the site is
      # main's, whichever commit the release came from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        env:
          SUGU_REQUIRE_RELEASES: "1"
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset; built but not deployed."
            exit 0
          fi
          pnpm exec wrangler pages deploy --project-name sugu --branch main --commit-dirty=true
