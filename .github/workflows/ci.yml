# Runs scripts/ci.sh. Manual only while the repository is private, where
# macOS runner minutes are billed (decision.md D-019); add `push` and
# `pull_request` triggers to run it on every change.
name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s "$(printf "%s\n" /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)"

      - name: Install build tools
        run: brew install xcodegen cmake ninja

      - name: Restore native dependencies and data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vendor
            Frameworks
            Data
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/versions.sh', 'scripts/build-librime.sh', 'scripts/build-data.sh', 'Packages/SuguKit/Sources/sugu-tool/**', 'Packages/SuguKit/Sources/SuguRime/**', 'Packages/SuguKit/Sources/SuguCore/Lexicon/**', 'Packages/SuguKit/Sources/SuguLM/**', 'scripts/fetch-data.sh') }}

      - name: Check
        env:
          SUGU_BENCH_JSON: bench.json
        run: scripts/ci.sh

      - name: Keep benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore
