# Runs scripts/ci.sh, by hand and before every release build (release.yml).
# Not on every push while the repository is private, where macOS runner
# minutes are billed (decision.md D-019); add `push` and `pull_request`
# triggers to run it on every change.
name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: true
        type: string

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Install build tools
        run: brew install xcodegen

      - name: Restore native dependencies and data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vendor
            Frameworks
            Data
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/versions.sh', 'scripts/build-librime.sh', 'scripts/patches/**', 'scripts/build-data.sh', 'Packages/SuguKit/Sources/sugu-tool/**', 'Packages/SuguKit/Sources/SuguRime/**', 'Packages/SuguKit/Sources/SuguCore/Lexicon/**', 'Packages/SuguKit/Sources/SuguLM/**', 'scripts/fetch-data.sh') }}

      - name: Check
        env:
          SUGU_BENCH_JSON: bench.json
          SUGU_BUDGETS: report
        run: scripts/ci.sh

      - name: Keep benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore
