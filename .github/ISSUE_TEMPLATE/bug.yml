name: Bug
description: Something doesn't work, or a conversion is wrong
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you typed, what you expected and what you got.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Japanese, Chinese, English]
  - type: input
    id: app
    attributes:
      label: App you were typing in
  - type: input
    id: versions
    attributes:
      label: Sugu and macOS versions
      description: Sugu's version is in Settings › Advanced.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Optional. Settings › Advanced › Diagnostics exports your settings and Sugu's log; attach the file if it helps.
