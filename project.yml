name: Sugu
options:
  bundleIdPrefix: io.github.pythonshe
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  SuguKit:
    path: Packages/SuguKit
targets:
  Sugu:
    type: application
    platform: macOS
    sources:
      - path: Sugu
      - path: Data/Rime
        type: folder
        buildPhase: resources
      - path: Data/Lexicon
        type: folder
        buildPhase: resources
    dependencies:
      - package: SuguKit
        product: SuguInput
      - package: SuguKit
        product: SuguEngines
      - package: SuguKit
        product: SuguDictionaries
      - package: SuguKit
        product: SuguUpdates
    settings:
      base:
        PRODUCT_NAME: Sugu
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pythonshe.inputmethod.Sugu
        INFOPLIST_FILE: Sugu/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        INSTALL_PATH: /Library/Input Methods
        COMBINE_HIDPI_IMAGES: YES
        # Set by scripts/release.sh; without it the updater stays off.
        SPARKLE_PUBLIC_ED_KEY: ""
  # Logic tests for shell code that needs AppKit or InputMethodKit; no host
  # app, so running them never launches the input method.
  SuguTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SuguTests
      - path: Sugu/Input/TextInputClient.swift
    dependencies:
      - package: SuguKit
        product: SuguInput
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pythonshe.SuguTests
        SWIFT_OBJC_INTEROP_MODE: objcxx
schemes:
  Sugu:
    build:
      targets:
        Sugu: all
        SuguTests: [test]
    test:
      targets:
        - SuguTests
    run:
      config: Debug
    archive:
      config: Release
