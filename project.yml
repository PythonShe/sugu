name: Sugu
options:
  bundleIdPrefix: com.zheng-she
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  SuguKit:
    path: Packages/SuguKit
targets:
  Sugu:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Sugu
      - path: Assets/AppIcon.icon
        buildPhase: resources
      - path: Data/Rime
        type: folder
        buildPhase: resources
      - path: Data/Lexicon
        type: folder
        buildPhase: resources
      - path: Data/LM
        type: folder
        buildPhase: resources
    postBuildScripts:
      # AzooKey copies a tokenizer (CC BY-SA 4.0) for Zenzai personalization,
      # which Sugu never turns on; share-alike data is not shipped (D-072).
      # The script sandbox lets the phase remove only what it lists.
      - name: Remove unused share-alike data
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AzooKeyKanaKanjiConverter_EfficientNGram.bundle/Contents/Resources/tokenizer
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AzooKeyKanaKanjiConverter_EfficientNGram.bundle/Contents/Resources/tokenizer/README.md
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AzooKeyKanaKanjiConverter_EfficientNGram.bundle/Contents/Resources/tokenizer/config.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AzooKeyKanaKanjiConverter_EfficientNGram.bundle/Contents/Resources/tokenizer/merges.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AzooKeyKanaKanjiConverter_EfficientNGram.bundle/Contents/Resources/tokenizer/special_tokens_map.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AzooKeyKanaKanjiConverter_EfficientNGram.bundle/Contents/Resources/tokenizer/tokenizer.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AzooKeyKanaKanjiConverter_EfficientNGram.bundle/Contents/Resources/tokenizer/tokenizer_config.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AzooKeyKanaKanjiConverter_EfficientNGram.bundle/Contents/Resources/tokenizer/vocab.json
        script: |
          [ -d "${SCRIPT_OUTPUT_FILE_0:?}" ] || exit 0
          for file in "${SCRIPT_OUTPUT_FILE_0:?}"/*; do rm -f "$file"; done
          rmdir "${SCRIPT_OUTPUT_FILE_0:?}"
    dependencies:
      - package: SuguKit
        product: SuguInput
      - package: SuguKit
        product: SuguEngines
      - package: SuguKit
        product: SuguDictionaries
      - package: SuguKit
        product: SuguUpdates
    settings:
      base:
        PRODUCT_NAME: Sugu
        PRODUCT_BUNDLE_IDENTIFIER: com.zheng-she.inputmethod.Sugu
        INFOPLIST_FILE: Sugu/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_INTEROP_MODE: objcxx
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        INSTALL_PATH: /Library/Input Methods
        COMBINE_HIDPI_IMAGES: YES
        # FoundationModels exists from macOS 26; Sugu runs from macOS 14.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        # Set by scripts/release.sh; without it the updater stays off.
        SPARKLE_PUBLIC_ED_KEY: ""
  # Logic tests for shell code that needs AppKit or InputMethodKit; no host
  # app, so running them never launches the input method.
  SuguTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SuguTests
      - path: Sugu/Input/TextInputClient.swift
      - path: Sugu/Diagnostics/DiagnosticsReport.swift
      - path: Sugu/App/Bundle+Version.swift
      - path: Sugu/Candidates/CandidateView.swift
      - path: Sugu/Candidates/FloatingPanel.swift
    dependencies:
      - package: SuguKit
        product: SuguInput
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zheng-she.SuguTests
        SWIFT_OBJC_INTEROP_MODE: objcxx
schemes:
  Sugu:
    build:
      targets:
        Sugu: all
        SuguTests: [test]
    test:
      targets:
        - SuguTests
    run:
      config: Debug
    archive:
      config: Release
